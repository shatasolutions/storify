name: Bug
description: Bug report
title: "[Phase ?] Bug report"
labels: [bug]
body:
  - type: input
    id: phase
    attributes: { label: Phase, placeholder: "01" }
    validations: { required: true }
  - type: input
    id: epic
    attributes: { label: Epic }
  - type: textarea
    id: problem
    attributes: { label: Problem }
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes: { label: Evidence }
  - type: textarea
    id: scope
    attributes: { label: Scope }
  - type: textarea
    id: nonscope
    attributes: { label: Non-scope }
  - type: textarea
    id: ac
    attributes: { label: Acceptance criteria }
    validations: { required: true }
  - type: textarea
    id: security
    attributes: { label: Security impact }
  - type: textarea
    id: database
    attributes: { label: Database impact }
  - type: textarea
    id: tests
    attributes: { label: Tests }
  - type: textarea
    id: docs
    attributes: { label: Documentation }
  - type: textarea
    id: deps
    attributes: { label: Dependencies }
  - type: textarea
    id: blockers
    attributes: { label: Blockers }
  - type: checkboxes
    id: dod
    attributes:
      label: Definition of Done acknowledged
      options:
        - label: I will not claim done without evidence
          required: true
